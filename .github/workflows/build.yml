name: Build Android APK test file

on: push

jobs:
  build:
    name: Build APK with Buildozer (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build APK with Docker
        run: |
          docker run --rm \
            --user user \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            --entrypoint /bin/bash \
            ghcr.io/kivy/buildozer:latest \
            -c "pip install 'setuptools<69.0.0' 'cython<3.0.0' && buildozer android debug"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
          
